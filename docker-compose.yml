version: '3.8'

services:
  satellite-unet:
    build:
      context: .
      dockerfile: dockerfile
    container_name: satellite-net
    shm_size: 8g
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - ./prepped_data:/workspace
    stdin_open: true
    tty: true
    restart: unless-stopped
    depends_on:
      - mlflow
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000

  mlflow:
    image: "mlflow/mlflow:v2.14.3"
    container_name: mlflow
    ports:
      - "5000:5000"
    volumes:
      - ./mlflow-data:/mlflow
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri /mlflow